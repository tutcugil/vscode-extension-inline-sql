name: Release Extension

on:
  pull_request:
    types: [closed]
    branches: [test, prod]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@tutcugil'

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run lint
          npm test
          npm audit --audit-level=moderate

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "base_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine release version
        id: release
        env:
          BASE: ${{ steps.version.outputs.base_version }}
          BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |

          if [ "$BRANCH" = "test" ]; then
            VERSION="${BASE}-test"
            NPM_TAG="test"
          else
            VERSION="${BASE}"
            NPM_TAG="latest"
          fi

          {
            echo "version=$VERSION"
            echo "tag=v${VERSION}"
            echo "npm_tag=$NPM_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$RELEASE_BRANCH" = "test" ]; then
            npm run vsix -- --pre-release -o "inline-sql-${RELEASE_VERSION}.vsix"
          else
            npm run vsix -- -o "inline-sql-${RELEASE_VERSION}.vsix"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.version }}
          body: ${{ github.event.pull_request.body }}
          prerelease: ${{ github.event.pull_request.base.ref == 'test' }}
          files: "*.vsix"

      - name: Publish to GitHub Packages
        run: |
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
          node -e "
            const pkg = require('./package.json');
            pkg.name = '@tutcugil/vscode-extension-inline-sql';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm publish --tag "$NPM_TAG"
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        if: github.event.pull_request.base.ref == 'prod'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: npx --no-install vsce publish --packagePath "inline-sql-${RELEASE_VERSION}.vsix"
